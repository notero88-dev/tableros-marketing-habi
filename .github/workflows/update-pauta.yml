name: Actualizar Pauta Propiedades.com (cada 4h)

on:
  schedule:
    - cron: '0 */4 * * *'   # misma cadencia que el cron del hub
  workflow_dispatch:

concurrency:
  group: update-pauta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests "psycopg[binary]"

      - name: Build data.json
        env:
          META_PCOM_TOKEN:      ${{ secrets.META_PCOM_TOKEN }}
          META_PCOM_AD_ACCOUNT: ${{ secrets.META_PCOM_AD_ACCOUNT }}
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL:    ${{ secrets.NEON_DATABASE_URL }}
        run: |
          cd pauta-propiedades
          export BUILD_TS="$(date -u +%Y-%m-%dT%H:%MZ)"
          python3 build_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pauta-propiedades/data.json
          if git diff --staged --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Auto-update pauta data.json $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git push; then echo "push OK"; exit 0; fi
            git fetch origin main; git rebase -X ours origin/main || { git rebase --abort; git reset --hard origin/main; git checkout origin/main -- .; }
            git add pauta-propiedades/data.json; git diff --staged --quiet || git commit -m "Auto-update pauta data.json $(date -u +%Y-%m-%dT%H:%MZ)"
          done
          echo "no se pudo pushear"; exit 1
