name: Actualizar Marketing Loop (10 min)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: update-marketing-loop
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate with user credentials
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/adc.json
          gcloud config set project ${{ secrets.GCP_PROJECT }}
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=/tmp/adc.json" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json" >> $GITHUB_ENV

      - name: Build data.json
        env:
          INFOBIP_BASE_URL:   ${{ secrets.INFOBIP_BASE_URL }}
          INFOBIP_MX_API_KEY: ${{ secrets.INFOBIP_MX_API_KEY }}
          INFOBIP_CO_API_KEY: ${{ secrets.INFOBIP_CO_API_KEY }}
          GH_READ_TOKEN:      ${{ secrets.GH_READ_TOKEN }}
          META_ACCESS_TOKEN:  ${{ secrets.META_ACCESS_TOKEN }}
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL:  ${{ secrets.NEON_DATABASE_URL }}
        run: |
          cd marketing-loop
          export BUILD_TS="$(date -u +%Y-%m-%dT%H:%MZ)"
          pip install "psycopg[binary]"
          python3 build_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing-loop/data.json
          if git diff --staged --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Auto-update marketing-loop data.json $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git push; then echo "push OK"; exit 0; fi
            git fetch origin main; git rebase -X ours origin/main || { git rebase --abort; git reset --hard origin/main; git checkout origin/main -- .; }
            git add marketing-loop/data.json; git diff --staged --quiet || git commit -m "Auto-update marketing-loop data.json $(date -u +%Y-%m-%dT%H:%MZ)"
          done
          echo "no se pudo pushear"; exit 1
